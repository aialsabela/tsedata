name: TSETMC Scraper

on:
  schedule:
    - cron: '0 9 * * 0,1,2,3,6'
  workflow_dispatch:

# این بخش مجوز نوشتن و ذخیره فایل را صادر می‌کند
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: دانلود کدها
      uses: actions/checkout@v4

    - name: نصب پایتون
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: نصب کتابخانه‌ها
      run: |
        python -m pip install --upgrade pip
        pip install pytse-client pandas

    - name: اجرای کد
      run: python scraper.py

    - name: ذخیره و آپلود فایل در گیت‌هاب
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: بروزرسانی داده‌های بورس
        file_pattern: 'market_data.csv'
